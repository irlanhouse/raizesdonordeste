<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unidades - Raízes do Nordeste</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="css/style.css">

</head>

<body>

<img src="img/panela.png" class="panela" alt="">
<img src="img/cacto.png" class="cacto" alt="">
<img src="img/raiz.png" class="raiz" alt="">
<img src="img/avatar.png" class="avatar" alt="">

<header>

<nav>

<a href="pedido.html">
PEDIDOS
</a>

<a href="#"
   class="ativo">
UNIDADES
</a>

<a href="cardapio.html">
CARDÁPIO
</a>

<a href="fidelidade.html">
FIDELIDADE
</a>

<a href="#"
   onclick="fazerLogoff()"
   id="btnLogoff">

SAIR

</a>

</nav>

<div class="busca">

<button class="botao-lupa">

<img src="img/lupa.png"
     alt="Buscar">

</button>

<input
type="text"
id="buscaUnidade"
placeholder="Buscar unidades">

</div>

</header>

<main>

<h1>
SELECIONE A UNIDADE
</h1>

<div class="unidades">

<label class="unidade"
       data-unidade="savassi">

<input
type="radio"
name="unidade"
value="Raízes do Nordeste - Savassi">

<div>

<strong>
Raízes do Nordeste - Savassi
</strong>

<p>
Rua Pernambuco, 850
</p>

<p>
Belo Horizonte - MG
</p>

</div>

</label>

<label class="unidade"
       data-unidade="centro">

<input
type="radio"
name="unidade"
value="Raízes do Nordeste - Centro">

<div>

<strong>
Raízes do Nordeste - Centro
</strong>

<p>
Av. Afonso Pena, 1120
</p>

<p>
Belo Horizonte - MG
</p>

</div>

</label>

<label class="unidade"
       data-unidade="pampulha">

<input
type="radio"
name="unidade"
value="Raízes do Nordeste - Pampulha">

<div>

<strong>
Raízes do Nordeste - Pampulha
</strong>

<p>
Av. Portugal, 2200
</p>

<p>
Belo Horizonte - MG
</p>

</div>

</label>

</div>

<a href="#"
   class="btn-avancar"
   id="btnAvancar">

AVANÇAR

</a>

</main>

<script>

/* ==========================
   SEGURANÇA
========================== */

if(
!localStorage.getItem(
"usuarioLogado"
)
){

    window.location.href =
    "index.html";
}

/* ==========================
   LOGOFF
========================== */

function fazerLogoff(){

    localStorage.removeItem(
    "usuarioLogado"
    );

    localStorage.removeItem(
    "nomeUsuario"
    );

    window.location.href =
    "index.html";
}

/* ==========================
   BUSCA DE UNIDADES
========================== */

document
.getElementById(
"buscaUnidade"
)
.addEventListener(
"keyup",
function(){

    const termo =

    this.value
    .toLowerCase();

    document
    .querySelectorAll(
        ".unidade"
    )
    .forEach(item=>{

        const unidade =

        item.dataset.unidade;

        if(
            unidade.includes(
                termo
            )
        ){

            item.style.display =
            "flex";

        }else{

            item.style.display =
            "none";

        }

    });

});

/* ==========================
   AVANÇAR
========================== */

document
.getElementById(
"btnAvancar"
)
.addEventListener(
"click",
function(e){

    const unidadeSelecionada =

    document.querySelector(
        'input[name="unidade"]:checked'
    );

    if(
        !unidadeSelecionada
    ){

        alert(
        "Selecione uma unidade antes de continuar."
        );

        return;
    }

    localStorage.setItem(

        "unidade",

        unidadeSelecionada.value

    );

    window.location.href =
    "cardapio.html";

});

</script>

</body>

</html>
