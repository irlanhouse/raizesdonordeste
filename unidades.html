<main>

<h1>SELECIONE A UNIDADE</h1>

<div class="unidades">

<label class="unidade">

<input
type="radio"
name="unidade"
value="Raízes do Nordeste - Savassi">

<div>

<strong>Raízes do Nordeste - Savassi</strong>

<p>Rua Pernambuco, 850</p>

<p>Belo Horizonte - MG</p>

</div>

</label>

<label class="unidade">

<input
type="radio"
name="unidade"
value="Raízes do Nordeste - Centro">

<div>

<strong>Raízes do Nordeste - Centro</strong>

<p>Av. Afonso Pena, 1120</p>

<p>Belo Horizonte - MG</p>

</div>

</label>

<label class="unidade">

<input
type="radio"
name="unidade"
value="Raízes do Nordeste - Pampulha">

<div>

<strong>Raízes do Nordeste - Pampulha</strong>

<p>Av. Portugal, 2200</p>

<p>Belo Horizonte - MG</p>

</div>

</label>

</div>

<a href="cardapio.html"
   class="btn-avancar"
   id="btnAvancar">

AVANÇAR

</a>

</main>

<script>

document
.getElementById("btnAvancar")
.addEventListener(
"click",
function(e){

    const unidadeSelecionada =

    document.querySelector(
        'input[name="unidade"]:checked'
    );

    if(!unidadeSelecionada){

        alert(
        "Selecione uma unidade antes de continuar."
        );

        e.preventDefault();

        return;
    }

    localStorage.setItem(

        "unidade",

        unidadeSelecionada.value

    );

})

</script>

<script>

document
.getElementById(
"btnLogoff"
)
.addEventListener(
"click",
function(){

    localStorage.removeItem(
    "usuarioLogado"
    );

    localStorage.removeItem(
    "nomeUsuario"
    );

    alert(
    "Sessão encerrada com sucesso."
    );

    window.location.href =
    "index.html";

});

</script>
